<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPS Arena</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
      text-align: center;
    }

    .header {
      padding: 35px 20px;
      background: #111;
      border-bottom: 2px solid #d4af37;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      color: #d4af37;
      letter-spacing: 2px;
    }

    .subtitle {
      margin-top: 10px;
      color: #ccc;
    }

    .container {
      padding: 30px 20px;
    }

    .card {
      max-width: 400px;
      margin: 20px auto;
      padding: 25px;
      background: #151515;
      border-radius: 15px;
      border: 1px solid #333;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      background: #d4af37;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 15px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">OPS ARENA</div>
    <div class="subtitle">Official OPS Gaming Community</div>
  </div>

  <div class="container">

    <div class="card">
      <h2>Welcome to OPS Arena</h2>
      <p>Your home for APEX competitions, members, trophies and awards.</p>

      <button onclick="testConnection()">Test Connection</button>

      <div id="status">Waiting...</div>
    </div>

  </div>

  <script>
    const SUPABASE_URL =https://vzhizpcaqbtkrythrhok.supabase.co/rest/v1/
    const SUPABASE_KEY =sb_publishable_QzBm8EFI7u0DwHuWIKRO3Q_KOb_U9H0

    async function testConnection() {
      const status = document.getElementById("status");

      try {
        const response = await fetch(
          SUPABASE_URL + "/rest/v1/profiles?select=id&limit=1",
          {
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY
            }
          }
        );

        if (response.ok) {
          status.textContent = "✅ OPS Arena database connected!";
        } else {
          status.textContent = "❌ Connection failed. We will check the settings.";
        }
      } catch (error) {
        status.textContent = "❌ Unable to connect.";
      }
    }
  </script>

</body>
  </html>
